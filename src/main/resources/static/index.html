<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Insurance Management</title>
    <style>
        * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
       }

       body {
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
           background: #fafafa;
           min-height: 100vh;
           display: flex;
           align-items: center;
           justify-content: center;
           padding: 20px;
       }

       .login-container {
           background: white;
           padding: 50px 60px;
           border: 1px solid #e0e0e0;
           max-width: 450px;
           width: 100%;
       }

       .login-header {
           margin-bottom: 40px;
       }

       .login-header h1 {
           font-size: 24px;
           font-weight: 600;
           margin-bottom: 8px;
           letter-spacing: -0.5px;
           color: #000;
       }

       .login-header p {
           font-size: 13px;
           color: #666;
           font-weight: 400;
       }

       .tabs {
           display: flex;
           gap: 0;
           margin-bottom: 40px;
           border-bottom: 1px solid #e0e0e0;
       }

       .tab {
           flex: 1;
           padding: 16px 0;
           border: none;
           background: transparent;
           cursor: pointer;
           font-weight: 500;
           font-size: 13px;
           color: #666;
           transition: all 0.15s;
           border-bottom: 2px solid transparent;
           margin-bottom: -1px;
       }

       .tab:hover {
           color: #000;
       }

       .tab.active {
           color: #000;
           border-bottom-color: #000;
           font-weight: 600;
       }

       .tab-content {
           display: none;
       }

       .tab-content.active {
           display: block;
       }

       .form-group {
           margin-bottom: 24px;
       }

       .form-group label {
           display: block;
           font-size: 13px;
           font-weight: 500;
           color: #000;
           margin-bottom: 10px;
       }

       .form-group input {
           width: 100%;
           padding: 14px 16px;
           border: 1px solid #d0d0d0;
           border-radius: 6px;
           font-size: 14px;
           transition: all 0.15s;
           font-family: inherit;
           background: white;
       }

       .form-group input:focus {
           outline: none;
           border-color: #000;
       }

       .btn {
           width: 100%;
           padding: 14px 28px;
           border: none;
           border-radius: 6px;
           font-size: 13px;
           font-weight: 600;
           cursor: pointer;
           transition: all 0.15s;
           background: #000;
           color: white;
       }

       .btn:hover {
           background: #333;
       }

       .btn:disabled {
           opacity: 0.6;
           cursor: not-allowed;
       }

       .alert {
           padding: 16px 20px;
           border-radius: 6px;
           margin-top: 24px;
           font-size: 13px;
           font-weight: 500;
       }

       .alert-error {
           background: #d32f2f;
           color: white;
       }

       .alert-success {
           background: #000;
           color: white;
       }

       .footer-links {
           text-align: center;
           margin-top: 32px;
           font-size: 13px;
           color: #666;
       }

       .footer-links a {
           color: #000;
           text-decoration: none;
           font-weight: 600;
       }

       .footer-links a:hover {
           text-decoration: underline;
       }

       .modal {
           display: none;
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background: rgba(0, 0, 0, 0.5);
           z-index: 1000;
           align-items: center;
           justify-content: center;
       }

       .modal.active {
           display: flex;
       }

       .modal-content {
           background: white;
           padding: 40px;
           border-radius: 8px;
           max-width: 400px;
           width: 90%;
           text-align: center;
           box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
       }

       .modal-icon {
           font-size: 48px;
           margin-bottom: 20px;
       }

       .modal-title {
           font-size: 22px;
           font-weight: 600;
           color: #000;
           margin-bottom: 12px;
       }

       .modal-message {
           font-size: 14px;
           color: #666;
           margin-bottom: 24px;
           line-height: 1.6;
       }

       .customer-id-box {
           background: #f5f5f5;
           padding: 20px;
           border-radius: 6px;
           margin-bottom: 24px;
           border: 2px solid #e0e0e0;
       }

       .customer-id-label {
           font-size: 12px;
           color: #666;
           margin-bottom: 8px;
           font-weight: 500;
           text-transform: uppercase;
           letter-spacing: 0.5px;
       }

       .customer-id-value {
           font-size: 32px;
           font-weight: 700;
           color: #000;
           font-family: 'Courier New', monospace;
       }

       .modal-note {
           font-size: 13px;
           color: #d32f2f;
           margin-bottom: 24px;
           padding: 12px;
           background: #ffebee;
           border-radius: 6px;
           font-weight: 500;
       }

       .modal-btn {
           width: 100%;
           padding: 14px 28px;
           border: none;
           border-radius: 6px;
           font-size: 13px;
           font-weight: 600;
           cursor: pointer;
           background: #000;
           color: white;
           transition: all 0.15s;
       }

       .modal-btn:hover {
           background: #333;
       }

       @media (max-width: 480px) {
           .login-container {
               padding: 32px 24px;
           }

           .login-header h1 {
               font-size: 20px;
           }

           .modal-content {
               padding: 30px 20px;
           }

           .customer-id-value {
               font-size: 28px;
           }
       }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>Customer Portal</h1>
        <p>Access your insurance policies</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div id="login" class="tab-content active">
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn" id="loginBtn">Sign In</button>
        </form>
        <div id="loginAlert"></div>
    </div>

    <!-- Register Form -->
    <div id="register" class="tab-content">
        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="your.email@example.com" required>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="regPhone" placeholder="Your phone number" required>
            </div>

            <div class="form-group">
                <label>Address</label>
                <input type="text" id="regAddress" placeholder="Your address" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="regUsername" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Choose a strong password" required minlength="6">
            </div>

            <button type="submit" class="btn" id="registerBtn">Create Account</button>
        </form>
        <div id="registerAlert"></div>
    </div>

    <div class="footer-links">
        <p>Admin? <a href="/admin/admin-login.html">Login here</a></p>
    </div>
</div>

<!-- Success Modal -->
<div class="modal" id="successModal">
    <div class="modal-content">
        <div class="modal-icon">✅</div>
        <h2 class="modal-title">Registration Successful!</h2>
        <p class="modal-message">Your account has been created successfully. Please save your Customer ID for future reference.</p>

        <div class="customer-id-box">
            <div class="customer-id-label">Your Customer ID</div>
            <div class="customer-id-value" id="displayCustomerId">-</div>
        </div>

        <div class="modal-note">
            ⚠️ Please save this ID! You may need it for customer support inquiries.
        </div>

        <button class="modal-btn" id="continueBtn">Continue to Dashboard</button>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8099';

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        event.target.classList.add('active');
        document.getElementById(tabName).classList.add('active');
    }

    // In customer-login.html, update the login form handler
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const loginBtn = document.getElementById('loginBtn');
    const alertDiv = document.getElementById('loginAlert');

    const username = document.getElementById('loginUsername').value;
    const password = document.getElementById('loginPassword').value;

    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';
    alertDiv.innerHTML = '';

    try {
        const response = await fetch(`${API_BASE_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
            if (data.role !== 'CUSTOMER') {
                alertDiv.innerHTML = '<div class="alert alert-error">This portal is for customers only.</div>';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
                return;
            }

            // Store authentication data
            sessionStorage.setItem('token', data.token);
            sessionStorage.setItem('customerId', data.customerId);
            sessionStorage.setItem('username', data.username);

            alertDiv.innerHTML = '<div class="alert alert-success">Login successful! Redirecting...</div>';

            setTimeout(() => {
                window.location.href = '/customer/customer-dashboard.html';
            }, 1000);
        } else {
            alertDiv.innerHTML = `<div class="alert alert-error">${data.error || 'Login failed'}</div>`;
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In';
        }
    } catch (error) {
        alertDiv.innerHTML = '<div class="alert alert-error">Connection error. Please try again.</div>';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
    }
});

    // Update the register form handler
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const registerBtn = document.getElementById('registerBtn');
    const alertDiv = document.getElementById('registerAlert');

    const requestData = {
        name: document.getElementById('regName').value,
        email: document.getElementById('regEmail').value,
        phone: document.getElementById('regPhone').value,
        address: document.getElementById('regAddress').value,
        username: document.getElementById('regUsername').value,
        password: document.getElementById('regPassword').value,
        role: 'CUSTOMER'
    };

    registerBtn.disabled = true;
    registerBtn.textContent = 'Creating account...';
    alertDiv.innerHTML = '';

    try {
        const response = await fetch(`${API_BASE_URL}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestData)
        });

        const data = await response.json();

        if (response.ok) {
            // Store authentication data
            sessionStorage.setItem('token', data.token);
            sessionStorage.setItem('customerId', data.customerId);
            sessionStorage.setItem('username', data.username);

            // Show success modal with Customer ID
            document.getElementById('displayCustomerId').textContent = data.customerId;
            document.getElementById('successModal').classList.add('active');

            // Redirect on button click
            document.getElementById('continueBtn').onclick = () => {
                window.location.href = '/customer/customer-dashboard.html';
            };
        } else {
            alertDiv.innerHTML = `<div class="alert alert-error">${data.error || 'Registration failed'}</div>`;
            registerBtn.disabled = false;
            registerBtn.textContent = 'Create Account';
        }
    } catch (error) {
        alertDiv.innerHTML = '<div class="alert alert-error">Connection error. Please try again.</div>';
        registerBtn.disabled = false;
        registerBtn.textContent = 'Create Account';
    }
});

    // Check if already logged in
    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (token) {
            fetch(`${API_BASE_URL}/auth/validate`, {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(r => r.json())
            .then(data => {
                if (data.valid && data.role === 'CUSTOMER') {
                    window.location.href = '/customer/customer-dashboard.html?token=' + token;
                }
            });
        }
    };
</script>
</body>
</html>
