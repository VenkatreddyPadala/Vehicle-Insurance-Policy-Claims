<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Insurance Management</title>
    <style>
        * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
       }

       body {
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
           background: #fafafa;
           min-height: 100vh;
           display: flex;
           align-items: center;
           justify-content: center;
           padding: 20px;
       }

       .login-container {
           background: white;
           padding: 50px 60px;
           border: 1px solid #e0e0e0;
           max-width: 450px;
           width: 100%;
       }

       .login-header {
           margin-bottom: 40px;
       }

       .login-header h1 {
           font-size: 24px;
           font-weight: 600;
           margin-bottom: 8px;
           letter-spacing: -0.5px;
           color: #000;
       }

       .login-header p {
           font-size: 13px;
           color: #666;
           font-weight: 400;
       }

       .tabs {
           display: flex;
           gap: 0;
           margin-bottom: 40px;
           border-bottom: 1px solid #e0e0e0;
       }

       .tab {
           flex: 1;
           padding: 16px 0;
           border: none;
           background: transparent;
           cursor: pointer;
           font-weight: 500;
           font-size: 13px;
           color: #666;
           transition: all 0.15s;
           border-bottom: 2px solid transparent;
           margin-bottom: -1px;
       }

       .tab:hover {
           color: #000;
       }

       .tab.active {
           color: #000;
           border-bottom-color: #000;
           font-weight: 600;
       }

       .tab-content {
           display: none;
       }

       .tab-content.active {
           display: block;
       }

       .form-group {
           margin-bottom: 24px;
       }

       .form-group label {
           display: block;
           font-size: 13px;
           font-weight: 500;
           color: #000;
           margin-bottom: 10px;
       }

       .form-group input {
           width: 100%;
           padding: 14px 16px;
           border: 1px solid #d0d0d0;
           border-radius: 6px;
           font-size: 14px;
           transition: all 0.15s;
           font-family: inherit;
           background: white;
       }

       .form-group input:focus {
           outline: none;
           border-color: #000;
       }

       .btn {
           width: 100%;
           padding: 14px 28px;
           border: none;
           border-radius: 6px;
           font-size: 13px;
           font-weight: 600;
           cursor: pointer;
           transition: all 0.15s;
           background: #000;
           color: white;
       }

       .btn:hover {
           background: #333;
       }

       .btn:disabled {
           opacity: 0.6;
           cursor: not-allowed;
       }

       .alert {
           padding: 16px 20px;
           border-radius: 6px;
           margin-top: 24px;
           font-size: 13px;
           font-weight: 500;
       }

       .alert-error {
           background: #d32f2f;
           color: white;
       }

       .alert-success {
           background: #000;
           color: white;
       }

       .footer-links {
           text-align: center;
           margin-top: 32px;
           font-size: 13px;
           color: #666;
       }

       .footer-links a {
           color: #000;
           text-decoration: none;
           font-weight: 600;
       }

       .footer-links a:hover {
           text-decoration: underline;
       }

       .help-text {
           font-size: 12px;
           color: #666;
           margin-top: 8px;
           font-weight: 400;
       }

       @media (max-width: 480px) {
           .login-container {
               padding: 32px 24px;
           }

           .login-header h1 {
               font-size: 20px;
           }
       }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>Customer Portal</h1>
        <p>Access your insurance policies</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div id="login" class="tab-content active">
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn" id="loginBtn">Sign In</button>
        </form>
        <div id="loginAlert"></div>
    </div>

    <!-- Register Form -->
    <div id="register" class="tab-content">
        <form id="registerForm">
            <div class="form-group">
                <label>Customer ID</label>
                <input type="number" id="regCustomerId" placeholder="Your customer ID" required>
                <div class="help-text">Contact admin if you don't have a customer ID</div>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="regUsername" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="your.email@example.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Choose a strong password" required minlength="6">
            </div>

            <button type="submit" class="btn" id="registerBtn">Create Account</button>
        </form>
        <div id="registerAlert"></div>
    </div>

    <div class="footer-links">
        <p>Admin? <a href="admin-login.html">Login here</a></p>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8099';

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        event.target.classList.add('active');
        document.getElementById(tabName).classList.add('active');
    }

    // Login Form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const loginBtn = document.getElementById('loginBtn');
        const alertDiv = document.getElementById('loginAlert');

        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;

        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';
        alertDiv.innerHTML = '';

        try {
            const response = await fetch(`${API_BASE_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                if (data.role !== 'CUSTOMER') {
                    alertDiv.innerHTML = '<div class="alert alert-error">This portal is for customers only.</div>';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                    return;
                }

                // Store token and user data
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify({
                    username: data.username,
                    email: data.email,
                    role: data.role,
                    customerId: data.customerId
                }));

                alertDiv.innerHTML = '<div class="alert alert-success">Login successful! Redirecting...</div>';

                setTimeout(() => {
                    window.location.href = 'customer-dashboard.html';
                }, 1000);
            } else {
                alertDiv.innerHTML = `<div class="alert alert-error">${data.error || 'Login failed'}</div>`;
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        } catch (error) {
            alertDiv.innerHTML = '<div class="alert alert-error">Connection error. Please try again.</div>';
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In';
        }
    });

    // Register Form
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const registerBtn = document.getElementById('registerBtn');
        const alertDiv = document.getElementById('registerAlert');

        const customerId = parseInt(document.getElementById('regCustomerId').value);
        const username = document.getElementById('regUsername').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;

        registerBtn.disabled = true;
        registerBtn.textContent = 'Creating account...';
        alertDiv.innerHTML = '';

        try {
            const response = await fetch(`${API_BASE_URL}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username,
                    email,
                    password,
                    role: 'CUSTOMER',
                    customerId
                })
            });

            const data = await response.json();

            if (response.ok) {
                // Store token and user data
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify({
                    username: data.username,
                    email: data.email,
                    role: data.role,
                    customerId: data.customerId
                }));

                alertDiv.innerHTML = '<div class="alert alert-success">Registration successful! Redirecting...</div>';

                setTimeout(() => {
                    window.location.href = 'customer-dashboard.html';
                }, 1000);
            } else {
                alertDiv.innerHTML = `<div class="alert alert-error">${data.error || 'Registration failed'}</div>`;
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create Account';
            }
        } catch (error) {
            alertDiv.innerHTML = '<div class="alert alert-error">Connection error. Please try again.</div>';
            registerBtn.disabled = false;
            registerBtn.textContent = 'Create Account';
        }
    });

    // Check if already logged in
    window.onload = () => {
        const token = localStorage.getItem('token');
        if (token) {
            fetch(`${API_BASE_URL}/auth/validate`, {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(r => r.json())
            .then(data => {
                if (data.valid && data.role === 'CUSTOMER') {
                    window.location.href = 'customer-dashboard.html';
                }
            });
        }
    };
</script>
</body>
</html>
