<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Insurance Management</title>
    <style>
        /* Minimal Professional UI - Matching Admin Portal */

 * {
     margin: 0;
     padding: 0;
     box-sizing: border-box;
 }

 body {
     font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
     background: #fafafa;
     min-height: 100vh;
     display: flex;
     align-items: center;
     justify-content: center;
     padding: 20px;
 }

 .login-container {
     background: white;
     padding: 50px 60px;
     border: 1px solid #e0e0e0;
     max-width: 450px;
     width: 100%;
 }

 .login-header {
     margin-bottom: 40px;
 }

 .login-header h1 {
     font-size: 24px;
     font-weight: 600;
     margin-bottom: 8px;
     letter-spacing: -0.5px;
     color: #000;
 }

 .login-header p {
     font-size: 13px;
     color: #666;
     font-weight: 400;
 }

 .form-group {
     margin-bottom: 24px;
 }

 .form-group label {
     display: block;
     font-size: 13px;
     font-weight: 500;
     color: #000;
     margin-bottom: 10px;
 }

 .form-group input {
     width: 100%;
     padding: 14px 16px;
     border: 1px solid #d0d0d0;
     border-radius: 6px;
     font-size: 14px;
     transition: all 0.15s;
     font-family: inherit;
     background: white;
 }

 .form-group input:focus {
     outline: none;
     border-color: #000;
 }

 .btn {
     width: 100%;
     padding: 14px 28px;
     border: none;
     border-radius: 6px;
     font-size: 13px;
     font-weight: 600;
     cursor: pointer;
     transition: all 0.15s;
     background: #000;
     color: white;
 }

 .btn:hover {
     background: #333;
 }

 .btn:disabled {
     opacity: 0.6;
     cursor: not-allowed;
 }

 .alert {
     padding: 16px 20px;
     border-radius: 6px;
     margin-top: 24px;
     font-size: 13px;
     font-weight: 500;
 }

 .alert-error {
     background: #d32f2f;
     color: white;
 }

 .alert-success {
     background: #000;
     color: white;
 }

 .footer-links {
     text-align: center;
     margin-top: 32px;
     font-size: 13px;
     color: #666;
 }

 .footer-links a {
     color: #000;
     text-decoration: none;
     font-weight: 600;
 }

 .footer-links a:hover {
     text-decoration: underline;
 }

 @media (max-width: 480px) {
     .login-container {
         padding: 32px 24px;
     }

     .login-header h1 {
         font-size: 20px;
     }
 }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>Admin Portal</h1>
        <p>Sign in to manage the system</p>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn" id="loginBtn">Sign In</button>
    </form>

    <div id="alert"></div>

    <div class="footer-links">
        <p>Customer? <a href="customer-login.html">Login here</a></p>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8099';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const loginBtn = document.getElementById('loginBtn');
        const alertDiv = document.getElementById('alert');

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Disable button
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';
        alertDiv.innerHTML = '';

        try {
            const response = await fetch(`${API_BASE_URL}/auth/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Check if user is admin
                if (data.role !== 'ADMIN') {
                    alertDiv.innerHTML = '<div class="alert alert-error">Access denied. Admin privileges required.</div>';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                    return;
                }

                // Store token and user data
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify({
                    username: data.username,
                    email: data.email,
                    role: data.role
                }));

                // Show success
                alertDiv.innerHTML = '<div class="alert alert-success">Login successful! Redirecting...</div>';

                // Redirect to admin dashboard
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                alertDiv.innerHTML = `<div class="alert alert-error">${data.error || 'Login failed'}</div>`;
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        } catch (error) {
            alertDiv.innerHTML = '<div class="alert alert-error">Connection error. Please try again.</div>';
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In';
        }
    });

    // Check if already logged in
    window.onload = () => {
        const token = localStorage.getItem('token');
        if (token) {
            // Validate token
            fetch(`${API_BASE_URL}/auth/validate`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(r => r.json())
            .then(data => {
                if (data.valid && data.role === 'ADMIN') {
                    window.location.href = 'index.html';
                }
            });
        }
    };
</script>
</body>
</html>
